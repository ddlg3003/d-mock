# One question per file, ordered by its number. This starter talks to the mock directly so
# it passes before you add a service; with a service, call your API instead.
name: the partner answers per order, and records every call
vars:
  order: "ord-${run}"                        # ${run} is unique per run: put it in every id you create
  partner: "http://localhost:14000"

steps:
  - name: arrange — the partner has approved this order
    mock: { name: partner, set: { key: "${vars.order}", state: { status: APPROVED } } }

  - name: act — ask the partner (your service would do this)
    http: { url: "${vars.partner}/orders/${vars.order}" }
    expect: { status: 200, json.status: APPROVED }

  - name: arrange — the next call fails
    mock: { name: partner, fault: { key: "${vars.order}", fault: http500, times: 1 } }

  - name: act — the failing call
    http: { url: "${vars.partner}/orders/${vars.order}" }
    expect: { status: 500 }

  - name: assert — the partner saw both calls, in order
    mock: { name: partner, calls: { route: get-order, key: "${vars.order}" } }
    expect:
      count: 2
      calls.0.status: 200
      calls.1.status: 500
