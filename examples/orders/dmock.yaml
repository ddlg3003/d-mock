# The orders suite: the toy service in toy/ as a local process, with Redis and a decision API mock.
#   dmock test .             (or from the repo root: make e2e)
# The same service in a container with k8s-like limits is the nested suite containers/.
project: orders-example

deps:
  redis:
    kind: redis
    mode: container            # switch with: dmock --mode redis=remote ...
    container:
      image: redis:7.2.4
      ports: ["16379:6379"]
      vars: { addr: "localhost:16379" }
    remote:
      vars: { addr: "${env.ORDERS_REDIS_ADDR}" }
    ready: { tcp: "localhost:16379", timeout: 30s }

mocks:
  decisions: { port: 13001 }     # spec: mocks/decisions.yaml

services:
  orders:                      # config: configs/orders.tmpl.yaml
    dir: toy
    cmd: ["go", "run", "."]
    env: { ORDERS_CONFIG: "${services.orders.config}" }
    ready: { http: "http://localhost:18080/healthz", timeout: 90s }
    depends_on: [redis, decisions]
